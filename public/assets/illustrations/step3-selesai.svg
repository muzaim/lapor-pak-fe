<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" fill="none">
  <!-- Background subtle blob -->
  <path d="M400 180C430 260 370 340 290 360C210 380 120 330 70 260C20 190 40 100 120 50C200 0 310 20 370 80C430 140 370 100 400 180Z" fill="#F1F5F9"/>

  <!-- Base Floor Line -->
  <rect x="50" y="310" width="400" height="8" rx="4" fill="#CBD5E1"/>

  <!-- Giant Success Badge Banner in Center -->
  <circle cx="250" cy="160" r="80" fill="#E0F2FE"/>
  <circle cx="250" cy="160" r="65" fill="#0284C7"/>
  <path d="M220 160L242 182L282 142" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confetti / Celebration Elements -->
  <circle cx="130" cy="90" r="6" fill="#38BDF8"/>
  <circle cx="370" cy="100" r="8" fill="#F59E0B"/>
  <rect x="150" y="140" width="12" height="12" rx="3" fill="#10B981" transform="rotate(25 150 140)"/>
  <rect x="340" y="160" width="14" height="14" rx="3" fill="#0284C7" transform="rotate(45 340 160)"/>
  <circle cx="320" cy="70" r="5" fill="#EC4899"/>
  <rect x="180" y="60" width="10" height="10" rx="2" fill="#F59E0B" transform="rotate(15 180 60)"/>

  <!-- Resolution Proof Card (Bottom Center) -->
  <g transform="translate(160, 240)">
    <rect x="0" y="0" width="180" height="65" rx="12" fill="#FFFFFF" filter="drop-shadow(0px 6px 16px rgba(2, 132, 199, 0.12))" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="25" cy="32" r="14" fill="#D1FAE5"/>
    <path d="M20 32L23 35L30 28" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="20" width="80" height="7" rx="3.5" fill="#0F172A"/>
    <rect x="48" y="34" width="110" height="5" rx="2.5" fill="#64748B"/>
    <rect x="48" y="44" width="65" height="5" rx="2.5" fill="#94A3B8"/>
  </g>

  <!-- Happy Citizen Character (Left) -->
  <g transform="translate(70, 160)">
    <!-- Legs -->
    <rect x="30" y="70" width="12" height="80" rx="6" fill="#1E293B"/>
    <rect x="48" y="70" width="12" height="80" rx="6" fill="#334155"/>
    <!-- Shoes -->
    <path d="M20 145C20 145 42 145 42 150H20V145Z" fill="#0284C7"/>
    <path d="M40 145C40 145 62 145 62 150H40V145Z" fill="#0284C7"/>
    <!-- Torso -->
    <path d="M20 10C20 10 70 10 70 75H20V10Z" fill="#0284C7"/>
    <!-- Arm Cheering -->
    <path d="M25 25L5 -5" stroke="#FDBA74" stroke-width="9" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="45" cy="-15" r="16" fill="#FDBA74"/>
    <path d="M30 -20C30 -30 45 -35 60 -25C65 -20 60 -10 60 -10H30Z" fill="#0F172A"/>
  </g>

  <!-- Happy Field Officer Character (Right) -->
  <g transform="translate(360, 160)">
    <!-- Legs -->
    <rect x="30" y="70" width="12" height="80" rx="6" fill="#1E293B"/>
    <rect x="48" y="70" width="12" height="80" rx="6" fill="#334155"/>
    <!-- Shoes -->
    <path d="M20 145C20 145 42 145 42 150H20V145Z" fill="#0F172A"/>
    <path d="M40 145C40 145 62 145 62 150H40V145Z" fill="#0F172A"/>
    <!-- Torso -->
    <path d="M20 10C20 10 70 10 70 75H20V10Z" fill="#0284C7"/>
    <!-- Arm Thumbs Up -->
    <path d="M65 25L85 5" stroke="#FDBA74" stroke-width="9" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="45" cy="-15" r="16" fill="#FDBA74"/>
    <path d="M30 -20C30 -30 45 -35 60 -25C65 -20 60 -10 60 -10H30Z" fill="#0F172A"/>
  </g>
</svg>
